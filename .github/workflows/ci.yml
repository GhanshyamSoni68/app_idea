name: CI
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: devstep, POSTGRES_PASSWORD: devstep, POSTGRES_DB: devstep_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devstep" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_pgsql, coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - name: Format (Pint)
        run: vendor/bin/pint --test
      - name: Content validates (dev mode: review state is still pending)
        run: php artisan content:validate --path=../content --dev
      - name: PHP tests (Postgres)
        run: php artisan test
        env: { DB_HOST: 127.0.0.1, DB_DATABASE: devstep_test, DB_USERNAME: devstep, DB_PASSWORD: devstep }
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
