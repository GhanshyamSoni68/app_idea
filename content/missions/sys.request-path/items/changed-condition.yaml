id: sys.request-path.changed-condition
role: primary
type: single_choice
evidence_basis: auto_scored
time_estimate_minutes: 2
scenario_key: sys.sc.submit-work-order
scenario: Suppose the application sent the email inside the request instead of queuing it.
prompt: What would change if the mail service were slow?
options:
  - key: a
    correct: true
    text: The user would wait longer, or the request could fail, because the email hop would be synchronous.
    feedback: Yes. Moving the email into the request makes its speed and failures part of what the user experiences.
  - key: b
    text: Nothing would change for the user, because the email is always sent in the background.
    misconception: sys.mc.done-at-response
    feedback: Only a queued email is background work. Sent inside the request, the user waits for it.
hints:
  - Which hops does the user wait for?
reveal: The user would wait for the slow mail service, because the hop would be synchronous.
